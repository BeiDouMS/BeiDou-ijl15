[general]
;IME 修复方案，只有0和1两种，优先尝试方案1（更完美），如果会卡门再尝试方案0
imeType=1
;分辨率 (推荐值: 1280x720, 1366x768; 其他可选: 1600x900, 1920x1080, 1024x768; 不保证可用: 800x600)
width=1280
height=720
;服务器地址
ServerIP_Address=127.0.0.1
serverIP_Port=8484
;加载文字汉化
SwitchChinese=true
;右下角消息数量
MsgAmount=10
;does your UI.wz include the MapleEzorsiaV2wzfiles.img? (true/false, default true if using UI.wz provided in setup guide)
EzorsiaV2WzIncluded=true
;is a resolution specific login frame being used in UI.wz? (true/false, default true if EzorsiaV2WzIncluded=true)
;somewhat obselete, mostly kept for ppl who wanna use their own login frame by directly editing the original frame in wz
CustomLoginFrame=true
;开启后登录界面的UI会按大边框布局，请确保UI使用了大边框才开启
bigLoginFrame=true
;窗口模式
WindowedMode=true
;跳过开头的动画
RemoveLogos=true
;Should VirtuProtect be enabled? (true/false, default true) (this is necessary for clients without CRC bypass such as hendi's clients
;that havent been editted further, can be turned off for clients with CRC bypass to save whatever processing power it uses)
UseVirtuProtect=true

[optional]
;物理攻击 面板上限
setDamageCap=199999
;魔攻/魔防 面板上限
setMAtkCap=1999
;命中上限
setAccCap=999
;回避上限
setAvdCap=999
;真实输出上限
setAtkOutCap=199999
;移速上限
speedMovementCap=140
;跳跃上限
jumpCap=123
;爬绳速度自适应：true=随移动速度变化；false=固定值
climbSpeedAuto=false
;爬绳基础速度系数
climbSpeed=1.0
;一种超级机制，不开启的话，升级属性点/技能点会停顿1秒，宠物捡取时攻击会停下来
useTubi=true
;did you wz edit UI/Login.img/Common/frame to something else and are using it?(true/false, default false)
ownLoginFrame=false
;did you wz edit the cashshop backgrnd(s) to something else and are using it?(true/false, default false)
ownCashShopFrame=false
; 允许重复发言相同内容
talkRepeat=false
; 连续说话限制 (毫秒)
talkTime=2000

[debug]
debug=false
;免密模式，解除客户端密码限制（须先开启debug）
noPassword=false

[compat]
;跨环境兼容修复。三项都只在"检测到确实有问题"时才介入，正常的中文 Windows 上
;它们全部是空操作，所以默认都开着，一般不需要动。

;【补显示模式表】修复"启动时弹 -214xxxxxxx 数字错误框然后退出"
;客户端启动时会枚举显卡支持的显示模式，在里面找上面配置的 width x height，
;找不到就直接放弃启动（连 CreateDevice 都不会调，所以窗口模式之类的设置救不了）。
;实测：远程桌面会话里整张模式表只有 1 条（桌面自身分辨率）；macOS 内置 Retina 屏
;上 264 条全是苹果的 16:10 缩放档（1280x800 等），一条标准 PC 分辨率都没有；
;插外接显示器就正常，因为外接屏会上报标准分辨率表。
;打开后：目标分辨率不在真实模式表里时，往表尾补几条。客户端是窗口模式，
;找到模式后并不会真的去切显示模式，所以没有副作用。表里本来就有就一条都不补。
FakeModeInject=true

;【中文显示】修复非中文系统上满屏乱码（英文 Windows、macOS 上的 Wine）
;客户端是 ANSI 程序，中文以 GBK 字节存放，最终显示要过两道转换，两道都跟着
;"系统区域设置(非Unicode程序)"走：一是客户端自己调 MultiByteToWideChar 转宽字符，
;二是它用 TextOutA 画字、而 GDI 按"当前字体的 charset"挑解码代码页——客户端建字体
;时给的是 DEFAULT_CHARSET，含义正是"跟随系统区域"。非中文系统上就被当拉丁文解码了。
;第一道转换的修复是必需且无副作用的，没有开关，只要系统代码页不是 936 就自动生效；
;这个开关控制第二道，也就是把建字体时的 DEFAULT_CHARSET 钉成 GB2312。
;万一在某些 Wine 环境下导致字体被替换得难看，可以只关这一项。
;系统代码页本来就是 936 时，两道都不装钩子。
ForceFontCharset=true

;【网卡枚举】修复"选完角色进入游戏时卡死"（Mac/Wine 上必现，Windows 不受影响）
;客户端选完角色后要枚举网卡取 MAC 地址，写法是在栈上开一个 0x2800 字节的缓冲区，
;调 GetAdaptersInfo，然后完全不检查返回值就把缓冲区当链表遍历，而缓冲区事先没清零。
;Wine 上这个 API 会失败，于是它遍历的是未初始化的栈垃圾，next 指针是野值 -> 访问违例。
;更麻烦的是崩溃之后：客户端自己的异常处理器在写转储文件时会二次崩溃，重入后去抢一把
;自己已经持有的自旋锁，无限 Sleep 重试 —— 所以表现成永久假死，连错误框都不弹。
;打开后：仅在 GetAdaptersInfo 真的失败时，替它造一条合法的以太网卡记录
;（MAC 由卷序列号+计算机名稳定生成，同一台机器每次都一样）。调用成功时一个字节都不改。
FixAdapterInfo=true
